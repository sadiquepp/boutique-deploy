  # cache is MIRRORED rather than built (CACHE_BUILD=0 upstream), so no
  # pipeline run produces a digest for it. Tag-pinned until it is built or
  # mirrored by a pipeline step that reports one.
  - name: registry.example.com:8443/online-boutique/cache
    newName: registry.hub.mylab.com:8443/online-boutique/cache
    newTag: v0.10.6
