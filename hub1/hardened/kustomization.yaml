    digest: sha256:7ffae880aefc0aa14b15f1aeddc1d419d7feaec6fb264e77bbf82c45bef546a5
  - name: registry.example.com:8443/online-boutique/loadgenerator
    newName: registry.hub.mylab.com:8443/online-boutique/loadgenerator
    digest: sha256:128cae78c325b882f7abd113157e452cd6bb02566f0807fea55da298374aad0d
  - name: registry.example.com:8443/online-boutique/paymentservice
    newName: registry.hub.mylab.com:8443/online-boutique/paymentservice
    digest: sha256:c447e8fe717b538ffeba5bd7b3cb2d33c186375186651fb6c029ae60f2682104
  - name: registry.example.com:8443/online-boutique/productcatalogservice
    newName: registry.hub.mylab.com:8443/online-boutique/productcatalogservice
    digest: sha256:4ec5c96c073515b6226eed2a83c56f036adfdfd0271d88e4623a9abc0ab9efd9
  - name: registry.example.com:8443/online-boutique/recommendationservice
    newName: registry.hub.mylab.com:8443/online-boutique/recommendationservice
    digest: sha256:9fc759c448dc1011adfe2c6a1e4c73c2354724dcafd03cde3f86c90c53516639
  - name: registry.example.com:8443/online-boutique/shippingservice
