    digest: sha256:78a6e700e3238d0e8e23a4b92c53919ee33b08077b1b82dd9e182d5ff625d2f6
  - name: registry.example.com:8443/online-boutique/paymentservice
    newName: registry.hub.mylab.com:8443/online-boutique/paymentservice
    digest: sha256:265854b7133568dae6312cb7c16951b6784d47736877cfe67014500760a02826
  - name: registry.example.com:8443/online-boutique/productcatalogservice
    newName: registry.hub.mylab.com:8443/online-boutique/productcatalogservice
    digest: sha256:98e1e6520ead11f382e4d220cec8c1ffef76c36539cf48cd0517e0b3e89ecd55
  - name: registry.example.com:8443/online-boutique/recommendationservice
