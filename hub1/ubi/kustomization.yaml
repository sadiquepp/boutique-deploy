# Online Boutique, ubi base set, as deployed on hub1.
#
# Everything here is cluster-specific by design -- that is what this repository
# is for. The structure comes from sadiquepp/openshift, which keeps placeholder
# values; the real registry and the digest per service live here.
#
# HOW THE IMAGE OVERRIDE WORKS, because it is not obvious:
#
# The base overlay already rewrites every image to
# registry.example.com:8443/online-boutique/<service>:v0.10.6. A parent
# kustomization's `images:` matches on the name AS IT IS AFTER that rewrite,
# NOT on upstream's us-central1-docker.pkg.dev name. Keying on the upstream
# name silently matches nothing and the placeholder registry survives into the
# cluster, where it fails as ImagePullBackOff. Verified by rendering both ways.
#
# So each entry below does two jobs at once: point at the real registry
# (newName) and pin the exact image (digest). No separate set-registry.sh step,
# and no deploy branch of the upstream repository.
#
# digest and newTag are mutually exclusive -- a digest replaces the tag
# entirely, so the rendered reference is <newName>@sha256:...
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Remote base. ref=main follows that branch, so a change to the overlay's
  # STRUCTURE arrives here without a commit. Pin a tag or commit instead if you
  # want that to be deliberate -- the trade-off is a second commit whenever the
  # overlay legitimately changes shape.
  #
  # Argo CD's repo-server fetches this over HTTPS from github.com. On a
  # disconnected cluster it cannot, and the answer there is to commit rendered
  # manifests (kustomize build output) instead of a remote base.
  - github.com/sadiquepp/openshift//test-workloads/online-boutique/overlays/ubi?ref=main

# Overrides the namespace the upstream overlay sets, so that overlay needs no
# per-cluster copy.
namespace: boutique-ubi

patches:
  # The upstream overlay creates its own Namespace, which is cluster-scoped and
  # belongs to the platform admin (pipelines/gitops/01-namespaces.yaml in the
  # upstream repo creates it, labelled for the default Argo CD instance).
  - target:
      kind: Namespace
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: online-boutique-ubi

# The upstream overlay sets imagePullPolicy: Always, which a digest makes
# unnecessary -- a digest cannot point at different content. Harmless: it costs
# one registry round-trip per pod start. Left in place rather than patched out,
# so this file stays a pure image-and-namespace override.
images:
  - name: registry.example.com:8443/online-boutique/adservice
    newName: registry.hub.mylab.com:8443/online-boutique/adservice
    digest: sha256:553ba83938b31734718c087cea37486109adbf7184f30b35a1ebb64d7a5a2fe1
  - name: registry.example.com:8443/online-boutique/cartservice
    newName: registry.hub.mylab.com:8443/online-boutique/cartservice
    digest: sha256:82e74f9ba81dec2775e356dfe455cfc73e9eb6056a0027860fb6654144c169c3
  - name: registry.example.com:8443/online-boutique/checkoutservice
    newName: registry.hub.mylab.com:8443/online-boutique/checkoutservice
    digest: sha256:2d13096e5dd03d92506c04e8536ff3b6d57a873e932f9b777c5d5584ca74dc90
  - name: registry.example.com:8443/online-boutique/currencyservice
    newName: registry.hub.mylab.com:8443/online-boutique/currencyservice
    digest: sha256:936f9ad0c7f8aede5b93b6bbada7bcd2e812354f7206eb084fdad77661bae297
  - name: registry.example.com:8443/online-boutique/emailservice
    newName: registry.hub.mylab.com:8443/online-boutique/emailservice
    digest: sha256:4c6227a72590bd22efc8b1fe4db6c6ae5e55a03ea8bac45c446acda17e5995da
  - name: registry.example.com:8443/online-boutique/frontend
